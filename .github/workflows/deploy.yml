name: Deploy CampusFix AI Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend with Vite
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.PUBLIC_HTTPS_BACKEND_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "PUBLIC_HTTPS_BACKEND_URL is required before deploying the frontend."
            exit 1
          fi
          case "$VITE_API_BASE_URL" in
            https://*) ;;
            *) echo "PUBLIC_HTTPS_BACKEND_URL must use HTTPS."; exit 1 ;;
          esac
          npm run build

      - name: Copy index.html as 404.html for SPA Routing
        working-directory: frontend/dist
        run: cp index.html 404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
